<svg width="100%" viewBox="0 0 720 280" role="img" aria-label="The extended-sequence-number rearrangement performed by crypto_authenc_esn_decrypt. The buffer arrives as SPI, sequence-number high half, sequence-number low half, ciphertext and tag. Before authenticating, the template copies the SPI down over the high half at offset 4 and writes the high half at offset assoclen plus cryptlen, at the start of the tag region, so that a window beginning at offset 4 reads SPI, low half, payload, high half, which is the ICV input RFC 4303 requires. Bytes 0 to 7 are restored afterwards; the four bytes written at assoclen plus cryptlen are not." xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest">
<metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>The ESN rearrangement in crypto_authenc_esn_decrypt()</title>
<desc>Two horizontal ribbons drawn to a common offset scale. The upper ribbon is the destination buffer as submitted: SPI, the high half of the sequence number, the low half, the ciphertext, and the tag region, with offsets 0, 4, 8, assoclen and assoclen plus cryptlen marked beneath. Two arrows lead to the lower ribbon, the rearranged state: the SPI has been copied down over offset 4, and the high half of the sequence number has been written four bytes into the start of the tag region at offset assoclen plus cryptlen. A bracket under the lower ribbon marks the window the MAC covers, which begins at offset 4 and runs assoclen plus cryptlen bytes. A note records that the restoring step puts back only bytes 0 to 7, so on the decryption path the four bytes written at assoclen plus cryptlen remain.</desc>



<defs>
  <marker id="arwE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0.5 1 L9 5 L0.5 9 Z" fill="rgb(83,74,183)"></path>
  </marker>
</defs>

<g class="f" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">

  <text class="cap" x="16" y="18" font-size="10.5px" font-weight="600" letter-spacing="0.06em" fill="rgb(120,118,112)" font-family="'Titillium Web', 'Inter', -apple-system, 'Segoe UI', sans-serif">THE ESN REARRANGEMENT — <tspan class="mono" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">crypto_authenc_esn_decrypt()</tspan></text>

  
  <text class="cap" x="16" y="44" font-size="10.5px" font-weight="600" letter-spacing="0.06em" fill="rgb(120,118,112)" font-family="'Titillium Web', 'Inter', -apple-system, 'Segoe UI', sans-serif">1 — AS SUBMITTED, IN <tspan class="mono" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">req-&gt;dst</tspan></text>

  <rect class="neu" x="44" y="54" width="60" height="32" rx="4" fill="rgb(255,255,255)" stroke="rgb(137,135,129)" stroke-width="0.75"></rect>
  <rect class="wrt" x="104" y="54" width="60" height="32" rx="4" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"></rect>
  <rect class="neu" x="164" y="54" width="60" height="32" rx="4" fill="rgb(255,255,255)" stroke="rgb(137,135,129)" stroke-width="0.75"></rect>
  <rect class="gry" x="224" y="54" width="336" height="32" rx="4" fill="rgb(241,239,232)" stroke="rgb(137,135,129)" stroke-width="0.75"></rect>
  <rect class="tagr" x="560" y="54" width="120" height="32" rx="4" fill="rgb(252,235,235)" stroke="rgb(163,45,45)" stroke-width="0.75"></rect>

  <text class="blk mono" x="74" y="75" text-anchor="middle" font-size="9.5px" fill="rgb(52,52,50)" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">SPI</text>
  <text class="blk mono" x="134" y="75" text-anchor="middle" fill="rgb(60,52,137)" font-size="9.5px" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">SeqHi</text>
  <text class="blk mono" x="194" y="75" text-anchor="middle" font-size="9.5px" fill="rgb(52,52,50)" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">SeqLow</text>
  <text class="blk" x="392" y="75" text-anchor="middle" font-size="9.5px" fill="rgb(52,52,50)" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">ciphertext — <tspan class="mono" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">cryptlen</tspan> bytes</text>
  <text class="blk" x="620" y="75" text-anchor="middle" fill="rgb(121,31,31)" font-size="9.5px" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">tag (<tspan class="mono" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">authsize</tspan>)</text>

  <line class="tick" x1="44" y1="86" x2="44" y2="92" stroke="rgb(178,176,169)" stroke-width="1"></line>
  <line class="tick" x1="104" y1="86" x2="104" y2="92" stroke="rgb(178,176,169)" stroke-width="1"></line>
  <line class="tick" x1="164" y1="86" x2="164" y2="92" stroke="rgb(178,176,169)" stroke-width="1"></line>
  <line class="tick" x1="224" y1="86" x2="224" y2="92" stroke="rgb(178,176,169)" stroke-width="1"></line>
  <line class="tick" x1="560" y1="86" x2="560" y2="92" stroke="rgb(178,176,169)" stroke-width="1"></line>
  <text class="cd mono" x="44" y="104" text-anchor="middle" font-size="8.5px" fill="rgb(120,118,112)" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">0</text>
  <text class="cd mono" x="104" y="104" text-anchor="middle" font-size="8.5px" fill="rgb(120,118,112)" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">4</text>
  <text class="cd mono" x="164" y="104" text-anchor="middle" font-size="8.5px" fill="rgb(120,118,112)" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">8</text>
  <text class="cd mono" x="224" y="104" text-anchor="middle" font-size="8.5px" fill="rgb(120,118,112)" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">assoclen</text>
  <text class="cd mono" x="560" y="104" text-anchor="middle" font-size="8.5px" fill="rgb(120,118,112)" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">assoclen + cryptlen</text>

  
  <path class="conn" d="M 144 90 V 127 H 575 V 152" marker-end="url(#arwE)" fill="none" stroke="rgb(83,74,183)" stroke-width="1.5"></path>
  <text class="cd" x="186" y="117" fill="rgb(60,52,137)" font-size="8.5px" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">the high half is written four bytes into the tag region, at offset assoclen + cryptlen</text>

  
  <text class="cap" x="16" y="146" font-size="10.5px" font-weight="600" letter-spacing="0.06em" fill="rgb(120,118,112)" font-family="'Titillium Web', 'Inter', -apple-system, 'Segoe UI', sans-serif">2 — REARRANGED IN PLACE, BEFORE THE MAC IS COMPUTED</text>

  <rect class="neu" x="44" y="156" width="60" height="32" rx="4" fill="rgb(255,255,255)" stroke="rgb(137,135,129)" stroke-width="0.75"></rect>
  <rect class="wrt" x="104" y="156" width="60" height="32" rx="4" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"></rect>
  <rect class="neu" x="164" y="156" width="60" height="32" rx="4" fill="rgb(255,255,255)" stroke="rgb(137,135,129)" stroke-width="0.75"></rect>
  <rect class="gry" x="224" y="156" width="336" height="32" rx="4" fill="rgb(241,239,232)" stroke="rgb(137,135,129)" stroke-width="0.75"></rect>
  <rect class="wrt" x="560" y="156" width="30" height="32" rx="4" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="1"></rect>
  <rect class="tagr" x="590" y="156" width="90" height="32" rx="4" fill="rgb(252,235,235)" stroke="rgb(163,45,45)" stroke-width="0.75"></rect>

  <text class="blk mono" x="74" y="177" text-anchor="middle" font-size="9.5px" fill="rgb(52,52,50)" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">SPI</text>
  <text class="blk mono" x="134" y="177" text-anchor="middle" fill="rgb(60,52,137)" font-size="9.5px" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">SPI copy</text>
  <text class="blk mono" x="194" y="177" text-anchor="middle" font-size="9.5px" fill="rgb(52,52,50)" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">SeqLow</text>
  <text class="blk" x="392" y="177" text-anchor="middle" font-size="9.5px" fill="rgb(52,52,50)" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">ciphertext — unchanged</text>
  <text class="blk" x="635" y="177" text-anchor="middle" fill="rgb(121,31,31)" font-size="9.5px" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">rest of tag</text>
  <text class="cd mono" x="575" y="202" text-anchor="middle" fill="rgb(60,52,137)" font-size="8.5px" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">SeqHi</text>

  
  <path class="brk" d="M 104 212 V 219 H 590 V 212" fill="none" stroke="rgb(137,135,129)" stroke-width="1"></path>
  <text class="note" x="104" y="234" font-size="9.5px" fill="rgb(95,94,90)" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">The MAC covers a window that starts at offset 4 and runs <tspan class="mono" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">assoclen + cryptlen</tspan> bytes —</text>
  <text class="note" x="104" y="248" font-size="9.5px" fill="rgb(95,94,90)" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">reading, in order, <tspan class="mono" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">SPI</tspan> ‖ <tspan class="mono" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">SeqLow</tspan> ‖ payload ‖ <tspan class="mono" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">SeqHi</tspan>: the ICV input RFC 4303 requires.</text>
  <text class="note" x="104" y="262" font-size="9.5px" fill="rgb(95,94,90)" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">The copy written over offset 4 is what makes that window contiguous.</text>
</g>
</svg>