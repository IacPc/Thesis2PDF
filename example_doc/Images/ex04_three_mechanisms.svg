<svg width="100%" viewBox="0 0 720 648" role="img" aria-label="The three mechanisms behind CVE-2022-0492 and how they connect: a user namespace supplies namespace-local CAP_SYS_ADMIN, which authorises mounting a cgroup v1 hierarchy whose release_agent file is owned by the mounter; when the cgroup empties, the kernel's usermode helper executes the stored path as full root in the host's initial namespaces." xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest">
<metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>The three mechanisms of CVE-2022-0492 and how they connect</title>
<desc>Two frames of reference are drawn as stacked bands. The upper band, the namespace-relative frame, contains the namespace-relativity of privilege (Section 8.3.3) and the cgroup filesystem interface (Section 8.3.1); the first supplies the authority that permits the second to be mounted and owned. The lower band, the namespace-absolute frame, contains the usermode helper (Section 8.3.2), which executes the path stored in release_agent with full root credentials in the host's initial namespaces. The arrow between the bands is the point at which the frame of reference changes.</desc>



<defs>
  <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0.5 1 L9 5 L0.5 9 Z" fill="rgb(137,135,129)"></path>
  </marker>
</defs>

<g class="f" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">

  
  <rect class="band" x="16" y="28" width="688" height="372" rx="12" fill="rgb(252,251,248)" stroke="rgb(178,176,169)" stroke-width="1" stroke-dasharray="5 4"></rect>
  <text class="cap" x="34" y="50" font-size="12px" font-weight="600" letter-spacing="0.06em" fill="rgb(120,118,112)" font-family="'Titillium Web', 'Inter', -apple-system, 'Segoe UI', sans-serif">NAMESPACE-RELATIVE FRAME — THE PROCESS'S OWN USER NAMESPACE</text>

  
  <rect x="40" y="64" width="640" height="96" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="0.75"></rect>
  <text class="tag" x="60" y="86" fill="rgb(83,74,183)" font-size="11px" font-weight="600" letter-spacing="0.08em" font-family="'Titillium Web', 'Inter', -apple-system, 'Segoe UI', sans-serif">SECTION 8.3.3</text>
  <text class="ttl" x="60" y="107" fill="rgb(60,52,137)" font-size="15px" font-weight="600" font-family="'Titillium Web', 'Inter', -apple-system, 'Segoe UI', sans-serif">Namespace-relativity of privilege</text>
  <text class="bdy" x="60" y="129" fill="rgb(74,66,160)" font-size="11px" font-weight="400" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">A process that creates a user namespace holds a full capability set within it, including</text>
  <text class="bdy" x="60" y="146" fill="rgb(74,66,160)" font-size="11px" font-weight="400" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><tspan class="mono" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">CAP_SYS_ADMIN</tspan>. Those capabilities are meaningful only over objects that namespace owns.</text>

  
  <line class="conn" x1="170" y1="164" x2="170" y2="214" marker-end="url(#arw)" fill="none" stroke="rgb(137,135,129)" stroke-width="1.5"></line>
  <text class="lead" x="188" y="178" font-size="12.5px" font-weight="600" fill="rgb(68,68,65)" font-family="'Titillium Web', 'Inter', -apple-system, 'Segoe UI', sans-serif">supplies the authority</text>
  <text class="note" x="188" y="194" font-size="11px" font-weight="400" fill="rgb(95,94,90)" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">CAP_SYS_ADMIN in the new namespace permits mounting a fresh cgroup v1</text>
  <text class="note" x="188" y="210" font-size="11px" font-weight="400" fill="rgb(95,94,90)" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">hierarchy — and the mounter owns every file in it.</text>

  
  <rect x="40" y="220" width="640" height="160" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.75"></rect>
  <text class="tag" x="60" y="242" fill="rgb(95,94,90)" font-size="11px" font-weight="600" letter-spacing="0.08em" font-family="'Titillium Web', 'Inter', -apple-system, 'Segoe UI', sans-serif">SECTION 8.3.1</text>
  <text class="ttl" x="60" y="263" fill="rgb(52,52,50)" font-size="15px" font-weight="600" font-family="'Titillium Web', 'Inter', -apple-system, 'Segoe UI', sans-serif">Control groups and the cgroup filesystem interface</text>
  <text class="bdy" x="60" y="285" fill="rgb(68,68,65)" font-size="11px" font-weight="400" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">cgroup v1 exposes no system call: each cgroup is a directory and each tunable a file, so</text>
  <text class="bdy" x="60" y="302" fill="rgb(68,68,65)" font-size="11px" font-weight="400" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">access control over them is ordinary filesystem permission — ownership and mode bits.</text>

  <rect class="chip" x="56" y="314" width="292" height="48" rx="6" fill="rgb(255,255,255)" stroke="rgb(137,135,129)" stroke-width="0.75"></rect>
  <text class="cn mono" x="72" y="334" font-size="11px" fill="rgb(68,68,65)" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">release_agent</text>
  <text class="cd" x="72" y="351" font-size="10px" fill="rgb(95,94,90)" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">hierarchy-wide: the path of a binary to run</text>

  <rect class="chip" x="372" y="314" width="292" height="48" rx="6" fill="rgb(255,255,255)" stroke="rgb(137,135,129)" stroke-width="0.75"></rect>
  <text class="cn mono" x="388" y="334" font-size="11px" fill="rgb(68,68,65)" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">notify_on_release</text>
  <text class="cd" x="388" y="351" font-size="10px" fill="rgb(95,94,90)" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">per-cgroup: arms the callback</text>

  
  <line class="conn" x1="202" y1="384" x2="202" y2="456" marker-end="url(#arw)" fill="none" stroke="rgb(137,135,129)" stroke-width="1.5"></line>
  <text class="lead" x="220" y="415" fill="rgb(121,31,31)" font-size="12.5px" font-weight="600" font-family="'Titillium Web', 'Inter', -apple-system, 'Segoe UI', sans-serif">delivers the effect</text>
  <text class="note" x="220" y="431" font-size="11px" font-weight="400" fill="rgb(95,94,90)" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">when the last process leaves a cgroup whose flag is set, the kernel</text>
  <text class="note" x="220" y="447" font-size="11px" font-weight="400" fill="rgb(95,94,90)" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">runs the path stored in <tspan class="mono" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">release_agent</tspan> — outside the namespace.</text>

  
  <rect class="band" x="16" y="464" width="688" height="166" rx="12" fill="rgb(252,251,248)" stroke="rgb(178,176,169)" stroke-width="1" stroke-dasharray="5 4"></rect>
  <text class="cap" x="34" y="486" font-size="12px" font-weight="600" letter-spacing="0.06em" fill="rgb(120,118,112)" font-family="'Titillium Web', 'Inter', -apple-system, 'Segoe UI', sans-serif">NAMESPACE-ABSOLUTE FRAME — THE HOST'S INITIAL NAMESPACES</text>

  <rect x="40" y="498" width="640" height="112" rx="8" fill="rgb(252,235,235)" stroke="rgb(163,45,45)" stroke-width="0.75"></rect>
  <text class="tag" x="60" y="520" fill="rgb(163,45,45)" font-size="11px" font-weight="600" letter-spacing="0.08em" font-family="'Titillium Web', 'Inter', -apple-system, 'Segoe UI', sans-serif">SECTION 8.3.2</text>
  <text class="ttl" x="60" y="541" fill="rgb(121,31,31)" font-size="15px" font-weight="600" font-family="'Titillium Web', 'Inter', -apple-system, 'Segoe UI', sans-serif">Usermode helpers and the privilege of the callback</text>
  <text class="bdy" x="60" y="563" fill="rgb(143,40,40)" font-size="11px" font-weight="400" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><tspan class="mono" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">call_usermodehelper()</tspan> forks from a kernel thread: the binary runs with the kernel's</text>
  <text class="bdy" x="60" y="580" fill="rgb(143,40,40)" font-size="11px" font-weight="400" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">own credentials — full root — in the initial PID, mount, network and user namespaces,</text>
  <text class="bdy" x="60" y="597" fill="rgb(143,40,40)" font-size="11px" font-weight="400" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">and its path is resolved against the host's root filesystem.</text>

</g>
</svg>