<svg width="100%" viewBox="0 0 720 372" role="img" aria-label="The in-place scatterlist arrangement built by _aead_recvmsg on the AEAD decryption path. The transmit scatterlist holds the associated data and ciphertext, sent with sendmsg, followed by the tag region, spliced from a readable file and therefore consisting of page-cache pages. The associated data and ciphertext are copied through the null cipher into the receive scatterlist, which describes the caller's own pinned pages; the tag entries are not copied but relinked onto the end of that list with sg_chain. The combined list is submitted as both the source and the destination of the request. Offset four receives the SPI, which is inside the caller's own buffer; offset assoclen plus cryptlen, the first byte past the caller's region and the first byte of a page-cache page, receives four attacker-chosen bytes." xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest">
<metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>The in-place arrangement built by _aead_recvmsg() on the decrypt path</title>
<desc>Two horizontal bars. The upper bar is the TX scatterlist: associated data and ciphertext sent with sendmsg, then a tag region spliced from a readable file, whose entries reference page-cache pages. A downward arrow marks the copy of the associated data and ciphertext into the lower bar through the null cipher; a second, dashed arrow marks the tag entries being relinked onto the end of the lower bar by sg_chain rather than copied. The lower bar is the RX scatterlist, submitted as both req-&gt;src and req-&gt;dst: its first portion is the caller's own pinned pages, and everything from offset assoclen plus cryptlen onward is the same page-cache memory the TX list described. An offset ruler beneath marks zero, offset four and the seam at assoclen plus cryptlen, and two annotation boxes give the two writes authencesn performs: the in-bounds write of the SPI at offset four, and the four attacker-chosen bytes written at the seam, into the page cache.</desc>



<defs>
  <marker id="cV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0.5 1 L9 5 L0.5 9 Z" fill="rgb(83,74,183)"></path>
  </marker>
  <marker id="cR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0.5 1 L9 5 L0.5 9 Z" fill="rgb(163,45,45)"></path>
  </marker>
</defs>

<g class="f" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">

  <text class="cap" x="12" y="16" font-size="12px" font-weight="600" letter-spacing="0.06em" fill="rgb(120,118,112)" font-family="'Titillium Web', 'Inter', -apple-system, 'Segoe UI', sans-serif">THE IN-PLACE ARRANGEMENT BUILT BY _aead_recvmsg() ON THE DECRYPT PATH</text>

  
  <text class="cap" x="140" y="42" font-size="12px" font-weight="600" letter-spacing="0.06em" fill="rgb(120,118,112)" font-family="'Titillium Web', 'Inter', -apple-system, 'Segoe UI', sans-serif">SENT WITH sendmsg(2)</text>
  <text class="capr" x="500" y="42" font-size="12px" font-weight="600" letter-spacing="0.06em" fill="rgb(143,40,40)" font-family="'Titillium Web', 'Inter', -apple-system, 'Segoe UI', sans-serif">SPLICED FROM A READABLE FILE</text>

  
  <text class="hdr mono" x="12" y="70" font-size="13px" font-weight="600" fill="rgb(52,52,50)" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">TX SGL</text>
  <text class="cd" x="12" y="85" font-size="10px" fill="rgb(120,118,112)" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">the input</text>

  <rect class="gry" x="140" y="52" width="110" height="44" rx="4" fill="rgb(241,239,232)" stroke="rgb(137,135,129)" stroke-width="0.75"></rect>
  <rect class="gry" x="250" y="52" width="250" height="44" rx="4" fill="rgb(241,239,232)" stroke="rgb(137,135,129)" stroke-width="0.75"></rect>
  <rect class="tagr" x="500" y="52" width="208" height="44" rx="4" fill="rgb(252,235,235)" stroke="rgb(163,45,45)" stroke-width="0.75"></rect>
  <text class="val mono" x="195" y="79" text-anchor="middle" font-size="11px" fill="rgb(52,52,50)" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">AAD</text>
  <text class="val" x="375" y="79" text-anchor="middle" font-size="11px" fill="rgb(52,52,50)" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">ciphertext</text>
  <text class="val mono" x="604" y="72" text-anchor="middle" fill="rgb(121,31,31)" font-size="11px" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">tag</text>
  <text class="cdr" x="604" y="87" text-anchor="middle" font-size="10px" fill="rgb(143,40,40)" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">page-cache pages</text>

  
  <path class="conn" d="M 320 100 V 136" marker-end="url(#cV)" fill="none" stroke="rgb(83,74,183)" stroke-width="1.5"></path>
  <text class="cd mono" x="334" y="116" font-size="10px" fill="rgb(120,118,112)" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">crypto_aead_copy_sgl()</text>
  <text class="cd" x="334" y="130" font-size="10px" fill="rgb(120,118,112)" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">copied through the null cipher</text>

  <path class="fail" d="M 604 100 V 136" marker-end="url(#cR)" fill="none" stroke="rgb(163,45,45)" stroke-width="1.5" stroke-dasharray="5 3"></path>
  <text class="cdr mono" x="592" y="116" text-anchor="end" font-size="10px" fill="rgb(143,40,40)" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">sg_chain()</text>
  <text class="cdr" x="592" y="130" text-anchor="end" font-size="10px" fill="rgb(143,40,40)" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">same entries</text>

  
  <text class="hdr mono" x="12" y="160" font-size="13px" font-weight="600" fill="rgb(52,52,50)" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">RX SGL</text>
  <text class="cd mono" x="12" y="175" font-size="10px" fill="rgb(120,118,112)" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">req-&gt;src</text>
  <text class="cd mono" x="12" y="188" font-size="10px" fill="rgb(120,118,112)" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">and req-&gt;dst</text>

  <rect class="neu" x="140" y="140" width="110" height="44" rx="4" fill="rgb(255,255,255)" stroke="rgb(137,135,129)" stroke-width="0.75"></rect>
  <rect class="gry" x="250" y="140" width="250" height="44" rx="4" fill="rgb(241,239,232)" stroke="rgb(137,135,129)" stroke-width="0.75"></rect>
  <rect class="tagd" x="500" y="140" width="208" height="44" rx="4" fill="rgb(252,235,235)" stroke="rgb(163,45,45)" stroke-width="1" stroke-dasharray="4 3"></rect>
  <text class="val mono" x="195" y="167" text-anchor="middle" font-size="11px" fill="rgb(52,52,50)" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">AAD</text>
  <text class="val" x="375" y="167" text-anchor="middle" font-size="11px" fill="rgb(52,52,50)" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">plaintext</text>
  <text class="val mono" x="604" y="160" text-anchor="middle" fill="rgb(121,31,31)" font-size="11px" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">tag</text>
  <text class="cdr" x="604" y="175" text-anchor="middle" font-size="10px" fill="rgb(143,40,40)" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">not the caller's memory</text>

  <text class="cd" x="320" y="199" text-anchor="middle" font-size="10px" fill="rgb(120,118,112)" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">the caller's own pinned pages</text>

  
  <path class="rule" d="M 140 210 H 708" fill="none" stroke="rgb(178,176,169)" stroke-width="1"></path>
  <path class="rule" d="M 140 206 V 216" fill="none" stroke="rgb(178,176,169)" stroke-width="1"></path>
  <path class="rule" d="M 176 206 V 216" fill="none" stroke="rgb(178,176,169)" stroke-width="1"></path>
  <path d="M 500 202 V 220" fill="none" stroke="rgb(163,45,45)" stroke-width="1.5"></path>

  <text class="cd mono" x="140" y="232" font-size="10px" fill="rgb(120,118,112)" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">0</text>
  <text class="cd mono" x="176" y="232" font-size="10px" fill="rgb(120,118,112)" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">4</text>
  <text class="cdr mono" x="500" y="232" text-anchor="middle" font-size="10px" fill="rgb(143,40,40)" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">assoclen + cryptlen</text>

  
  <path class="lead" d="M 176 236 V 250" fill="none" stroke="rgb(178,176,169)" stroke-width="1" stroke-dasharray="3 3"></path>
  <path class="leadr" d="M 500 236 V 250"></path>

  
  <rect class="box" x="12" y="250" width="330" height="66" rx="6" fill="rgb(252,251,248)" stroke="rgb(178,176,169)" stroke-width="1"></rect>
  <text class="cd mono" x="26" y="270" font-size="10px" fill="rgb(120,118,112)" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">…(tmp, dst, 4, 4, 1)</text>
  <text class="note" x="26" y="288" font-size="11px" fill="rgb(95,94,90)" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">writes the SPI over offset 4, inside the</text>
  <text class="note" x="26" y="304" font-size="11px" fill="rgb(95,94,90)" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">region the caller supplied for output.</text>

  <rect class="warn" x="378" y="250" width="330" height="66" rx="6" fill="rgb(252,235,235)" stroke="rgb(163,45,45)" stroke-width="1"></rect>
  <text class="cd mono" x="392" y="270" fill="rgb(121,31,31)" font-size="10px" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">…(tmp + 1, dst, assoclen + cryptlen, 4, 1)</text>
  <text class="note" x="392" y="288" font-size="11px" fill="rgb(95,94,90)" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">writes four attacker-chosen bytes at the</text>
  <text class="note" x="392" y="304" font-size="11px" fill="rgb(95,94,90)" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">seam — into the page cache.</text>

  <text class="note" x="12" y="340" font-size="11px" fill="rgb(95,94,90)" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Offset <tspan class="mono" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">assoclen + cryptlen</tspan> is the first byte past the region the caller supplied. Before the 2017 commit it</text>
  <text class="note" x="12" y="356" font-size="11px" fill="rgb(95,94,90)" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">belonged to a kernel buffer the caller never saw; after it, to a page <tspan class="mono" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">splice(2)</tspan> placed on the source side.</text>

</g>
</svg>