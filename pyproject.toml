[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "source"
version = "2.0.0"
description = "Markdown to a Università di Pisa styled thesis PDF (Markdown → HTML/CSS → PDF)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "Markdown>=3.5",
  "Pygments>=2.17",
  "PyYAML>=6.0",
  "weasyprint>=60",
]

[project.optional-dependencies]
wkhtmltopdf = []   # the wkhtmltopdf binary is installed outside pip

[project.scripts]
source = "source.cli:main"

[tool.setuptools]
packages = ["source"]

[tool.setuptools.package-data]
source = [
  "templates/*.html",
  "assets/*",
  "assets/fonts/*",
  "example/*",
  "example/**/*",
]
